name: Update arXiv digest

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-arxiv-digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch papers and build digest
        run: python arxiv_digest.py --include-seen --days 7 --max-results 1000 --output reports/latest.md

      - name: Commit updated digest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.json data/seen.json reports/latest.md
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "Update arXiv digest"
            git push
          fi
